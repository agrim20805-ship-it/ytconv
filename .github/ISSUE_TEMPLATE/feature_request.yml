name: Feature request
description: Suggest something ytconv should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help? (optional)
  - type: input
    id: example
    attributes:
      label: An example video, if it helps (optional)
      description: Only a public video you are happy to share.
