name: Bug report
description: Something went wrong or gave the wrong result
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Most download failures are fixed by updating yt-dlp
        (`pip install -U yt-dlp` or `brew upgrade yt-dlp`) - please try that first.
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15.4, Windows 11, Ubuntu 24.04...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed ytconv
      options:
        - pip install ytconv
        - pip install "ytconv[full]"
        - uv tool install / pipx
        - cloned the repo
        - other (say below)
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: ytconv version
      description: Paste the output of `python3 -m pip show ytconv`, or write "cloned repo at commit ..." (from `git rev-parse --short HEAD`).
      render: text
    validations:
      required: true
  - type: input
    id: ytdlp
    attributes:
      label: yt-dlp version
      description: The output of `yt-dlp --version`.
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: ffmpeg version
      description: The first line of `ffmpeg -version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: The output of `python3 --version`.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The full error output
      description: Everything it printed, not just the last line.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed anything private from the output above (names, folder paths, private video links).
          required: true
